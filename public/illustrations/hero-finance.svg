<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <!-- Background circles -->
  <circle cx="600" cy="150" r="200" fill="#dcfce7" opacity="0.5"/>
  <circle cx="200" cy="450" r="150" fill="#bbf7d0" opacity="0.3"/>
  
  <!-- Person sitting at desk -->
  <ellipse cx="400" cy="540" rx="180" ry="20" fill="#e2e8f0"/>
  
  <!-- Desk -->
  <rect x="220" y="360" width="360" height="16" rx="8" fill="#94a3b8"/>
  <rect x="270" y="376" width="12" height="80" rx="4" fill="#94a3b8"/>
  <rect x="518" y="376" width="12" height="80" rx="4" fill="#94a3b8"/>
  
  <!-- Monitor -->
  <rect x="290" y="220" width="220" height="145" rx="12" fill="#0f172a"/>
  <rect x="296" y="226" width="208" height="130" rx="8" fill="#1e293b"/>
  <!-- Monitor stand -->
  <rect x="388" y="365" width="24" height="20" rx="2" fill="#64748b"/>
  <rect x="370" y="382" width="60" height="8" rx="4" fill="#64748b"/>
  
  <!-- Screen content - chart -->
  <polyline points="310,320 340,295 370,305 400,275 430,280 460,255 490,260" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <polygon points="310,320 340,295 370,305 400,275 430,280 460,255 490,260 490,330 310,330" fill="#16a34a" opacity="0.15"/>
  
  <!-- Screen stats -->
  <rect x="310" y="238" width="60" height="8" rx="4" fill="#22c55e" opacity="0.8"/>
  <rect x="310" y="252" width="40" height="6" rx="3" fill="#64748b" opacity="0.5"/>
  <rect x="420" y="238" width="40" height="8" rx="4" fill="#ffffff" opacity="0.3"/>
  <rect x="420" y="252" width="60" height="6" rx="3" fill="#64748b" opacity="0.5"/>
  
  <!-- Keyboard -->
  <rect x="310" y="356" width="180" height="10" rx="3" fill="#cbd5e1"/>
  
  <!-- Person body -->
  <ellipse cx="530" cy="400" rx="45" ry="55" fill="#fbbf24"/>
  
  <!-- Person head -->
  <circle cx="530" cy="290" r="45" fill="#fcd34d"/>
  <!-- Hair -->
  <path d="M490 275 Q510 240 530 245 Q550 240 570 275 Q565 255 530 248 Q495 255 490 275Z" fill="#1e293b"/>
  <!-- Eyes -->
  <ellipse cx="518" cy="285" rx="5" ry="6" fill="#1e293b"/>
  <ellipse cx="542" cy="285" rx="5" ry="6" fill="#1e293b"/>
  <circle cx="520" cy="284" r="2" fill="white"/>
  <circle cx="544" cy="284" r="2" fill="white"/>
  <!-- Smile -->
  <path d="M518 300 Q530 312 542 300" stroke="#92400e" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Person arm -->
  <path d="M480 390 Q460 370 440 365" stroke="#fbbf24" stroke-width="18" stroke-linecap="round" fill="none"/>
  
  <!-- Floating coins -->
  <circle cx="640" cy="200" r="30" fill="#fbbf24"/>
  <text x="640" y="208" text-anchor="middle" fill="white" font-size="20" font-weight="bold" font-family="Arial">£</text>
  
  <circle cx="700" cy="280" r="22" fill="#16a34a"/>
  <text x="700" y="287" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="Arial">$</text>
  
  <circle cx="160" cy="220" r="25" fill="#2563eb"/>
  <text x="160" y="228" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="Arial">€</text>
  
  <!-- Bar chart floating card -->
  <rect x="600" y="330" width="140" height="100" rx="12" fill="white" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.1))"/>
  <rect x="620" y="395" width="15" height="25" rx="3" fill="#16a34a"/>
  <rect x="642" y="380" width="15" height="40" rx="3" fill="#16a34a" opacity="0.7"/>
  <rect x="664" y="365" width="15" height="55" rx="3" fill="#16a34a" opacity="0.5"/>
  <rect x="686" y="370" width="15" height="50" rx="3" fill="#16a34a" opacity="0.8"/>
  <rect x="614" y="345" width="80" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="614" y="358" width="55" height="5" rx="2.5" fill="#e2e8f0"/>
  
  <!-- Small pie chart -->
  <circle cx="155" cy="380" r="40" fill="none" stroke="#e2e8f0" stroke-width="20"/>
  <circle cx="155" cy="380" r="40" fill="none" stroke="#16a34a" stroke-width="20" stroke-dasharray="125 251" stroke-dashoffset="0"/>
  <circle cx="155" cy="380" r="40" fill="none" stroke="#2563eb" stroke-width="20" stroke-dasharray="75 251" stroke-dashoffset="-125"/>
  <circle cx="155" cy="380" r="20" fill="white"/>
  <rect x="110" y="330" width="90" height="90" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1"/>
</svg>
