<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <!-- Background -->
  <circle cx="300" cy="250" r="220" fill="#dbeafe" opacity="0.3"/>
  <circle cx="420" cy="150" r="100" fill="#dcfce7" opacity="0.3"/>
  
  <!-- Large login card -->
  <rect x="100" y="80" width="400" height="340" rx="24" fill="white" filter="drop-shadow(0 8px 32px rgba(0,0,0,0.12))"/>
  
  <!-- Card header -->
  <rect x="100" y="80" width="400" height="80" rx="24" fill="#f8fafc"/>
  <rect x="100" y="128" width="400" height="32" fill="#f8fafc"/>
  
  <!-- Logo -->
  <circle cx="300" cy="115" r="22" fill="#16a34a"/>
  <path d="M292 115 L298 121 L310 109" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Title -->
  <rect x="240" y="148" width="120" height="10" rx="5" fill="#0f172a"/>
  <rect x="265" y="165" width="70" height="7" rx="3.5" fill="#94a3b8"/>
  
  <!-- Form fields -->
  <!-- Email field -->
  <rect x="140" y="196" width="320" height="14" rx="4" fill="#e2e8f0"/>
  <rect x="140" y="196" width="70" height="14" rx="4" fill="#94a3b8"/>
  <rect x="140" y="222" width="320" height="44" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="156" y="240" width="100" height="8" rx="4" fill="#cbd5e1"/>
  <!-- Email icon -->
  <rect x="416" y="236" width="28" height="16" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M416 236 L430 246 L444 236" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Password field -->
  <rect x="140" y="280" width="320" height="14" rx="4" fill="#e2e8f0"/>
  <rect x="140" y="280" width="80" height="14" rx="4" fill="#94a3b8"/>
  <rect x="140" y="306" width="320" height="44" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="156" y="324" width="80" height="8" rx="4" fill="#0f172a" opacity="0.6"/>
  <!-- Dots for password -->
  <circle cx="156" cy="328" r="4" fill="#0f172a"/>
  <circle cx="170" cy="328" r="4" fill="#0f172a"/>
  <circle cx="184" cy="328" r="4" fill="#0f172a"/>
  <circle cx="198" cy="328" r="4" fill="#0f172a"/>
  <circle cx="212" cy="328" r="4" fill="#0f172a"/>
  <!-- Eye icon -->
  <ellipse cx="430" cy="328" rx="12" ry="8" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <circle cx="430" cy="328" r="4" fill="#94a3b8"/>
  
  <!-- Forgot password -->
  <rect x="360" y="360" width="100" height="7" rx="3.5" fill="#16a34a"/>
  
  <!-- Login button -->
  <rect x="140" y="375" width="320" height="48" rx="12" fill="#16a34a"/>
  <rect x="230" y="393" width="140" height="12" rx="6" fill="white"/>
  
  <!-- Sign up link -->
  <rect x="220" y="435" width="160" height="7" rx="3.5" fill="#e2e8f0"/>
  <rect x="310" y="435" width="70" height="7" rx="3.5" fill="#16a34a"/>
  
  <!-- Person illustration (right side floating) -->
  <circle cx="530" cy="200" r="45" fill="#fcd34d"/>
  <!-- Hair -->
  <path d="M490 185 Q510 155 530 160 Q550 155 570 185 Q565 165 530 158 Q495 165 490 185Z" fill="#1e293b"/>
  <!-- Eyes -->
  <ellipse cx="518" cy="195" rx="4" ry="5" fill="#1e293b"/>
  <ellipse cx="542" cy="195" rx="4" ry="5" fill="#1e293b"/>
  <circle cx="519" cy="194" r="1.5" fill="white"/>
  <circle cx="543" cy="194" r="1.5" fill="white"/>
  <!-- Smile -->
  <path d="M520 207 Q530 215 540 207" stroke="#92400e" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Person body -->
  <ellipse cx="530" cy="290" rx="40" ry="50" fill="#16a34a"/>
  <!-- Arms -->
  <path d="M490 270 Q475 285 470 300" stroke="#16a34a" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M570 270 Q585 285 590 300" stroke="#16a34a" stroke-width="16" stroke-linecap="round" fill="none"/>
  
  <!-- Key floating -->
  <circle cx="80" cy="160" r="18" fill="#fbbf24"/>
  <rect x="80" y="160" width="40" height="8" rx="4" fill="#fbbf24"/>
  <rect x="112" y="162" width="6" height="4" rx="2" fill="#92400e"/>
  <rect x="104" y="164" width="6" height="6" rx="2" fill="#92400e"/>
  <circle cx="80" cy="160" r="8" fill="#92400e"/>
  <circle cx="80" cy="160" r="4" fill="#fbbf24"/>
</svg>
