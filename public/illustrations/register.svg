<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <!-- Background -->
  <circle cx="300" cy="250" r="220" fill="#dcfce7" opacity="0.3"/>
  <circle cx="150" cy="150" r="100" fill="#dbeafe" opacity="0.25"/>
  
  <!-- Confetti -->
  <rect x="140" y="80" width="12" height="12" rx="2" fill="#fbbf24" transform="rotate(25 146 86)"/>
  <rect x="420" y="100" width="10" height="10" rx="2" fill="#2563eb" transform="rotate(-15 425 105)"/>
  <rect x="480" y="180" width="8" height="8" rx="2" fill="#16a34a" transform="rotate(35 484 184)"/>
  <rect x="100" y="260" width="10" height="10" rx="2" fill="#f59e0b" transform="rotate(-20 105 265)"/>
  <circle cx="200" cy="120" r="6" fill="#16a34a"/>
  <circle cx="460" cy="130" r="4" fill="#fbbf24"/>
  <circle cx="380" cy="80" r="5" fill="#2563eb"/>
  <circle cx="150" cy="380" r="4" fill="#f59e0b"/>
  
  <!-- Main register card -->
  <rect x="120" y="90" width="360" height="340" rx="24" fill="white" filter="drop-shadow(0 8px 32px rgba(0,0,0,0.1))"/>
  
  <!-- Welcome badge at top -->
  <rect x="230" y="75" width="140" height="32" rx="16" fill="#dcfce7" filter="drop-shadow(0 2px 8px rgba(22,163,74,0.2))"/>
  <circle cx="248" cy="91" r="8" fill="#16a34a"/>
  <path d="M244 91 L247 94 L252 88" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="260" y="86" width="95" height="10" rx="5" fill="#16a34a"/>
  
  <!-- Card header -->
  <rect x="120" y="90" width="360" height="60" rx="24" fill="#f8fafc"/>
  <rect x="120" y="122" width="360" height="28" fill="#f8fafc"/>
  
  <!-- Title -->
  <rect x="200" y="108" width="200" height="12" rx="6" fill="#0f172a"/>
  <rect x="225" y="126" width="150" height="8" rx="4" fill="#94a3b8"/>
  
  <!-- Name fields (2 columns) -->
  <rect x="140" y="170" width="80" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="140" y="170" width="55" height="10" rx="5" fill="#94a3b8"/>
  <rect x="140" y="186" width="145" height="40" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="154" y="202" width="80" height="8" rx="4" fill="#cbd5e1"/>
  
  <rect x="295" y="170" width="80" height="10" rx="5" fill="#e2e8f0"/>
  <rect x="295" y="170" width="55" height="10" rx="5" fill="#94a3b8"/>
  <rect x="295" y="186" width="145" height="40" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="309" y="202" width="80" height="8" rx="4" fill="#cbd5e1"/>
  
  <!-- Email field -->
  <rect x="140" y="238" width="80" height="10" rx="5" fill="#94a3b8"/>
  <rect x="140" y="254" width="300" height="40" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="154" y="270" width="120" height="8" rx="4" fill="#cbd5e1"/>
  
  <!-- Password field -->
  <rect x="140" y="306" width="80" height="10" rx="5" fill="#94a3b8"/>
  <rect x="140" y="322" width="300" height="40" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/>
  <circle cx="154" cy="342" r="4" fill="#0f172a"/>
  <circle cx="168" cy="342" r="4" fill="#0f172a"/>
  <circle cx="182" cy="342" r="4" fill="#0f172a"/>
  <circle cx="196" cy="342" r="4" fill="#0f172a"/>
  
  <!-- Consent checkbox -->
  <rect x="140" y="376" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <path d="M143 385 L147 389 L155 380" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="165" y="379" width="120" height="7" rx="3.5" fill="#e2e8f0"/>
  <rect x="290" y="379" width="60" height="7" rx="3.5" fill="#16a34a"/>
  <rect x="165" y="391" width="80" height="7" rx="3.5" fill="#e2e8f0"/>
  
  <!-- Register button -->
  <rect x="140" y="406" width="300" height="44" rx="12" fill="#16a34a"/>
  <rect x="220" y="424" width="140" height="10" rx="5" fill="white"/>
  
  <!-- Sign in link -->
  <rect x="190" y="461" width="90" height="7" rx="3.5" fill="#e2e8f0"/>
  <rect x="286" y="461" width="80" height="7" rx="3.5" fill="#16a34a"/>
  
  <!-- People celebrating (right side) -->
  <circle cx="520" cy="180" r="35" fill="#fcd34d"/>
  <path d="M490 166 Q508 145 520 150 Q532 145 550 166 Q546 150 520 146 Q494 150 490 166Z" fill="#1e293b"/>
  <ellipse cx="509" cy="178" rx="4" ry="5" fill="#1e293b"/>
  <ellipse cx="531" cy="178" rx="4" ry="5" fill="#1e293b"/>
  <path d="M510 192 Q520 199 530 192" stroke="#92400e" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <ellipse cx="520" cy="255" rx="35" ry="45" fill="#2563eb"/>
  <!-- Arms up celebrating -->
  <path d="M485 235 Q470 210 460 195" stroke="#2563eb" stroke-width="14" stroke-linecap="round" fill="none"/>
  <path d="M555 235 Q570 210 580 195" stroke="#2563eb" stroke-width="14" stroke-linecap="round" fill="none"/>
  
  <!-- Stars above person -->
  <path d="M460 185 L463 192 L470 195 L463 198 L460 205 L457 198 L450 195 L457 192 Z" fill="#fbbf24"/>
  <path d="M575 175 L578 181 L584 184 L578 187 L575 193 L572 187 L566 184 L572 181 Z" fill="#fbbf24"/>
</svg>
